<title>🎵 Sweet Caroline — Karaoke</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: #0a0a1a;
  color: #fff;
  font-family: 'Georgia', serif;
  overflow: hidden;
}

/* PLAYER */
.player {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10,10,26,0.95);
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 12px 20px 20px;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.progress-bar {
  width: 100%; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  margin-bottom: 12px;
  cursor: pointer;
  position: relative;
}
.progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #c9756a, #c9a96e);
  width: 0%; transition: width 0.1s linear;
  pointer-events: none;
}
.controls {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.btn-play {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #c9756a, #c9a96e);
  border: none; color: white; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(201,117,106,0.4);
}
.time { font-size: 12px; color: rgba(255,255,255,0.5); min-width: 80px; }
.track-info { flex: 1; text-align: center; }
.track-title { font-size: 13px; color: rgba(255,255,255,0.8); }
.track-artist { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }

/* LYRICS */
.lyrics-container {
  position: fixed; top: 0; left: 0; right: 0; bottom: 100px;
  overflow-y: auto;
  padding: 40px 20px 20px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.lyrics-container::-webkit-scrollbar { display: none; }

.lyric-line {
  text-align: center;
  padding: 6px 10px;
  margin: 2px 0;
  border-radius: 8px;
  transition: all 0.3s ease;
  cursor: pointer;
}
.lyric-line .words { display: inline; }
.lyric-word {
  display: inline;
  color: rgba(255,255,255,0.25);
  font-size: clamp(18px, 5vw, 26px);
  line-height: 1.5;
  transition: color 0.15s, text-shadow 0.15s;
  white-space: pre;
}
.lyric-word.active {
  color: #c9a96e;
  text-shadow: 0 0 20px rgba(201,169,110,0.8), 0 0 40px rgba(201,169,110,0.4);
}
.lyric-word.sung {
  color: rgba(255,255,255,0.55);
}
.lyric-line.current-line {
  background: rgba(201,169,110,0.08);
}
.lyric-line.section-label .lyric-word {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(201,117,106,0.5) !important;
  text-shadow: none !important;
}
.lyric-line.section-label.sung .lyric-word,
.lyric-line.section-label.active .lyric-word {
  color: rgba(201,117,106,0.5) !important;
}

/* spacers */
.spacer { height: 30vh; }
.spacer-sm { height: 16px; }

/* waiting indicator */
.waiting {
  text-align: center; padding: 20px;
  font-size: 12px; letter-spacing: 3px;
  color: rgba(255,255,255,0.2);
  text-transform: uppercase;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
</style>
</head>

// ── BUILD DOM ──
const container = document.getElementById('lyricsInner');
const allWords = [];

LINES.forEach((line, li) => {
  const div = document.createElement('div');
  div.className = 'lyric-line' + (line.section ? ' section-label' : '');
  div.dataset.line = li;

  line.words.forEach((w, wi) => {
    const span = document.createElement('span');
    span.className = 'lyric-word';
    span.textContent = w.w;
    span.dataset.t = w.t;
    span.dataset.end = w.end;
    span.dataset.line = li;
    div.appendChild(span);
    allWords.push({ el: span, lineEl: div, t: w.t, end: w.end, li });
  });

  container.appendChild(div);
});

// ── AUDIO ──
const audio = document.getElementById('audio');
let raf;
let lastActiveWord = null;
let lastActiveLine = null;

function pad(n) { return String(Math.floor(n)).padStart(2,'0'); }
function fmtTime(s) { return Math.floor(s/60) + ':' + pad(s%60); }

function onTimeUpdate() {
  const t = audio.currentTime;

  // progress
  document.getElementById('progressFill').style.width = (t / audio.duration * 100) + '%';
  document.getElementById('timeDisplay').textContent = fmtTime(t) + ' / ' + fmtTime(audio.duration || 206.65);

  // find active word
  let activeWord = null;
  for (let i = allWords.length - 1; i >= 0; i--) {
    if (t >= allWords[i].t) { activeWord = allWords[i]; break; }
  }

  if (activeWord !== lastActiveWord) {
    // clear previous
    allWords.forEach(w => {
      if (w.t < t) {
        w.el.classList.remove('active');
        w.el.classList.add('sung');
      } else {
        w.el.classList.remove('active', 'sung');
      }
    });
    if (activeWord && t < activeWord.end + 0.5) {
      activeWord.el.classList.add('active');
      activeWord.el.classList.remove('sung');
    }

    // scroll current line into view
    if (activeWord && activeWord.lineEl !== lastActiveLine) {
      lastActiveLine?.classList.remove('current-line');
      activeWord.lineEl.classList.add('current-line');
      lastActiveLine = activeWord.lineEl;
      activeWord.lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    lastActiveWord = activeWord;
  }

  raf = requestAnimationFrame(onTimeUpdate);
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    document.getElementById('btnPlay').textContent = '⏸';
    raf = requestAnimationFrame(onTimeUpdate);
  } else {
    audio.pause();
    document.getElementById('btnPlay').textContent = '▶';
    cancelAnimationFrame(raf);
  }
}

// progress bar seek
document.getElementById('progressBar').addEventListener('click', e => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * (audio.duration || 206.65);
  lastActiveWord = null;
  lastActiveLine = null;
});

// click on lyric line to seek
container.addEventListener('click', e => {
  const line = e.target.closest('.lyric-line');
  if (!line) return;
  const firstWord = line.querySelector('.lyric-word');
  if (firstWord) {
    audio.currentTime = parseFloat(firstWord.dataset.t);
    lastActiveWord = null; lastActiveLine = null;
    if (audio.paused) togglePlay();
  }
});

audio.addEventListener('ended', () => {
  document.getElementById('btnPlay').textContent = '▶';
  cancelAnimationFrame(raf);
});
</script>
