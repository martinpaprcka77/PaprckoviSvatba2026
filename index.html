<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5e6dc">
<title>Dagmar + Martin Paprčkovi — 29. srpna 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #c2534a;
  --rose-deep: #9c332b;
  --rose-soft: #e89aa6;
  --rose-light: #f9e2dc;
  --rose-mid: #e7b3a4;
  --gold: #c1902f;
  --gold-light: #e5c881;
  --gold-soft: #f3dfae;
  --gold-dark: #93690f;
  --cream: #fdf3e6;
  --text: #47221c;
  --text-muted: #99634f;
  --bg: #f7e6d3;
  --white: #fffcf6;
  --card: linear-gradient(165deg, #fffdf4 0%, #fdecd2 48%, #f9dcc0 100%);
  --shadow: 0 10px 28px rgba(146, 62, 46, 0.18);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  font-family: 'Lato', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  background:
    radial-gradient(120% 55% at 8% -8%, rgba(238, 150, 130, 0.4), transparent 58%),
    radial-gradient(120% 60% at 100% 18%, rgba(232, 196, 110, 0.38), transparent 55%),
    linear-gradient(180deg, #f8e4cf 0%, #f3d7bd 45%, #efcdb0 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh; /* iPhone: bez posuvu kvůli dynamické adresní liště */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
img { max-width: 100%; height: auto; }
button { font-family: inherit; touch-action: manipulation; }

/* ── HERO ── */
.hero {
  background:
    radial-gradient(85% 55% at 50% 0%, rgba(255, 252, 240, 0.95), transparent 60%),
    radial-gradient(60% 45% at 50% 38%, rgba(255, 240, 190, 0.55), transparent 70%),
    radial-gradient(120% 120% at 50% 125%, rgba(214, 120, 96, 0.55), transparent 58%),
    linear-gradient(165deg, #fcecd8 0%, #f6d3b4 50%, #efb896 100%);
  text-align: center;
  padding: calc(18px + var(--safe-top)) 24px 40px;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid rgba(178, 90, 78, 0.4);
  box-shadow: inset 0 -18px 30px -20px rgba(122, 62, 45, 0.5);
}

/* Text v hero posadíme nad watermark; watermark zůstane absolutně za ním. */
.hero > *:not(.heart-badge) { position: relative; z-index: 1; }
.hero-pre {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--rose-deep);
  margin-bottom: 10px;
}
.hero-names {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(52px, 14vw, 120px);
  color: var(--gold-dark);
  line-height: 1.1;
  text-shadow:
    0 1px 0 #fff,
    0 2px 0 rgba(255,255,255,0.7),
    0 4px 0 rgba(160, 90, 55, 0.18),
    0 7px 18px rgba(160, 90, 55, 0.3);
  display: inline-block;
  max-width: 100%;
}
.hero-amp,
.hero-surname {
  color: var(--rose-deep);
  display: inline;
  font-size: inherit;
  font-family: inherit;
  white-space: nowrap;
}
/* Úzké displeje (iPhone SE a menší): jméno na jeden řádek, o něco menší písmo */
@media (max-width: 360px) {
  .hero-names { font-size: clamp(40px, 11vw, 54px); }
}
.hero-divider {
  width: 210px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 16px auto 8px;
  border: none;
}
.hero-ornament { font-size: 18px; color: var(--gold); letter-spacing: 6px; }
.hero-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: 0.5px;
}
.hero-thanks {
  max-width: 470px;
  margin: 16px auto 0;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 19px;
  color: var(--text);
  line-height: 1.6;
  background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.25));
  padding: 10px 20px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.6);
}

/* ── COUNT-UP (since the wedding) ── */
.since-wrap {
  margin-top: 24px;
  padding: 16px 12px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,244,230,0.6));
  border: 1px solid rgba(178, 90, 78, 0.4);
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(122, 62, 45, 0.18);
  backdrop-filter: blur(6px);
}
.incident-sign {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
}
.incident-light {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #43b649;
  box-shadow: 0 0 0 0 rgba(67, 182, 73, 0.6);
  animation: incidentPulse 1.6s ease-out infinite;
  flex-shrink: 0;
}
@keyframes incidentPulse {
  0% { box-shadow: 0 0 0 0 rgba(67, 182, 73, 0.55); }
  70% { box-shadow: 0 0 0 9px rgba(67, 182, 73, 0); }
  100% { box-shadow: 0 0 0 0 rgba(67, 182, 73, 0); }
}
.incident-text {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
@media (prefers-reduced-motion: reduce) {
  .incident-light { animation: none; }
}
.since-grid {
  display: flex;
  justify-content: center;
  gap: 8px;
}
.since-box {
  min-width: 62px;
  background: linear-gradient(170deg, #fff9ec, #fbe3c0);
  border: 1px solid rgba(194, 83, 74, 0.45);
  border-radius: 12px;
  padding: 9px 7px 7px;
  box-shadow: 0 4px 12px rgba(146, 62, 46, 0.16);
}
.since-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  color: var(--gold-dark);
  display: block;
  line-height: 1;
  font-weight: 700;
}
.since-unit {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--rose-deep);
  font-weight: 500;
}

/* ── CONTAINER / SECTION ── */
.container { max-width: 540px; margin: 0 auto; padding: 22px 14px 40px; }
.section {
  margin-top: 22px;
  background: var(--card);
  border-radius: 20px;
  border: 1px solid rgba(178, 90, 78, 0.35);
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
}
.section::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(90% 60% at 100% 0%, rgba(217, 188, 122, 0.28), transparent 60%);
  pointer-events: none;
}
.section > * { position: relative; }
.section-head {
  padding: 18px 20px 0;
  display: flex;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1px dashed rgba(178, 90, 78, 0.35);
  padding-bottom: 12px;
}
.section-title {
  font-family: 'Great Vibes', cursive;
  font-size: 30px;
  color: var(--gold-dark);
  text-shadow: 0 1px 0 rgba(255,255,255,0.7);
}
.section-sub {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.section-body { padding: 16px 20px 18px; }

/* ── PHOTO GALLERY ── */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.gallery-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 4px 14px rgba(122, 62, 45, 0.25);
  display: block;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.gallery-grid img:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(122, 62, 45, 0.32); }

/* ── LIGHTBOX ── */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(20, 10, 8, 0.94);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: calc(24px + var(--safe-top)) 12px calc(24px + var(--safe-bottom));
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.lightbox-close {
  position: absolute;
  top: calc(12px + var(--safe-top));
  right: 12px;
  font-size: 30px;
  line-height: 1;
  color: var(--rose-light);
  background: none;
  border: none;
  cursor: pointer;
  min-width: 44px;
  min-height: 44px;
}
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 38px;
  color: var(--rose-light);
  background: none;
  border: none;
  cursor: pointer;
  padding: 12px;
  line-height: 1;
  min-width: 48px;
  min-height: 64px;
}
.lightbox-nav.prev { left: 4px; }
.lightbox-nav.next { right: 4px; }
.lightbox-counter {
  position: absolute;
  bottom: calc(16px + var(--safe-bottom));
  left: 0; right: 0;
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--rose-mid);
}

/* ── JUST MARRIED (watermark layer) ──
   Nápis JUST MARRIED se srdíčkem po každé straně, téměř neviditelná
   embossovaná vrstva za jmény v hero — ne samostatný oddíl. */
.heart-badge {
  position: absolute;
  top: 55%;
  left: 50%;
  transform: translate(-50%, -52%);
  z-index: 0;
  opacity: 0.14;
  pointer-events: none;
  filter: drop-shadow(0 2px 1px rgba(255,255,255,0.8));
  width: min(80vw, 460px);
}
/* Text v hero posadíme nad watermark; watermark zůstane absolutně za ním. */
.hero > *:not(.heart-badge) { position: relative; z-index: 1; }
.heart-badge svg { width: 100%; height: auto; display: block; }
.heart-badge text { font-family: 'Cormorant Garamond', serif; letter-spacing: 3px; }

/* ── FOOTER ── */
.footer {
  margin-top: 26px;
  text-align: center;
  padding: 14px 16px calc(20px + var(--safe-bottom));
  font-size: 11px;
  color: var(--rose-deep);
  letter-spacing: 1px;
}
.footer-ornament { display: block; font-size: 13px; color: var(--gold); letter-spacing: 5px; margin-bottom: 6px; }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="heart-badge" aria-hidden="true">
    <svg viewBox="0 0 520 70" width="520" height="70">
      <defs>
        <linearGradient id="heartGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4ddb0"/>
          <stop offset="0.5" stop-color="#caa84f"/>
          <stop offset="1" stop-color="#a8872e"/>
        </linearGradient>
        <path id="miniHeart"
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
              fill="url(#heartGold)"/>
      </defs>
      <!-- levé srdíčko -->
      <use href="#miniHeart" transform="translate(40 36) scale(1.5) translate(-12 -12)"/>
      <!-- emboss nápis: tmavý stín pod světlým -->
      <text x="260" y="43.5" text-anchor="middle" font-size="34" fill="#7a5a18" opacity="0.6">JUST MARRIED</text>
      <text x="260" y="41.5" text-anchor="middle" font-size="34" fill="#fff7e0" opacity="0.95">JUST MARRIED</text>
      <!-- pravé srdíčko -->
      <use href="#miniHeart" transform="translate(480 36) scale(1.5) translate(-12 -12)"/>
    </svg>
  </div>

  <div class="hero-pre">Děkujeme, že jste s námi</div>
  <div class="hero-names">Dagmar <span class="hero-amp">+</span> Martin Paprčkovi</div>
  <div class="hero-divider"></div>
  <div class="hero-ornament">✦ ❀ ✦</div>
  <div class="hero-date">Vzali jsme se 29. srpna 2026</div>
  <div class="hero-thanks">Bylo nám ctí oslavit s Vámi náš nejkrásnější den.</div>

  <div class="since-wrap">
    <div class="incident-sign" aria-hidden="true">
      <span class="incident-light"></span>
      <span class="incident-text" id="incidentText">Dnů bez incidentu:</span>
    </div>
    <div class="since-grid">
      <div class="since-box"><span class="since-num" id="sc-d">--</span><span class="since-unit">dní</span></div>
      <div class="since-box"><span class="since-num" id="sc-h">--</span><span class="since-unit">hodin</span></div>
      <div class="since-box"><span class="since-num" id="sc-m">--</span><span class="since-unit">minut</span></div>
      <div class="since-box"><span class="since-num" id="sc-s">--</span><span class="since-unit">sekund</span></div>
    </div>
  </div>
</div>

<div class="container">

  <!-- FOTKY -->
  <div class="section">
    <div class="section-head">
      <span class="section-title">Fotky z našeho dne</span>
      <span class="section-sub">pár vzpomínek</span>
    </div>
    <div class="section-body">
      <div class="gallery-grid" id="gallery"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-ornament">❀ ─── ✦ ─── ❀</span>
    29 · 08 · 2026 · Ostrava
  </div>

</div>

<script>
const WEDDING = new Date('2026-08-29T11:15:00'); // čas obřadu

/**
 * Počítadlo nahoru — kolik času uplynulo od svatby (na rozdíl od odpočtu dolů).
 * Čas běží od okamžiku obřadu dál; nikdy se nezastaví.
 */
function tick() {
  const now = Date.now();
  let diff = now - WEDDING.getTime();
  if (diff < 0) diff = 0; // před svatbou ukazuje nuly

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('sc-d').textContent = d;
  document.getElementById('sc-h').textContent = String(h).padStart(2, '0');
  document.getElementById('sc-m').textContent = String(m).padStart(2, '0');
  document.getElementById('sc-s').textContent = String(s).padStart(2, '0');
}

// ── Vtipné hlášky nad počítadlem (tovární cedule „bez incidentu“) ──
const INCIDENT_LINES = [
  'Dnů bez incidentu:',
  'Dnů bez sporu:',
  'Dnů bez připomínek k jídlu:',
  'Dnů bez „já jsem to říkala“:',
  'Dnů bez „kam dáváš ten hrnek“:',
  'Dnů bez neshody o deku:',
];
let incidentIdx = 0;

function rotateIncident() {
  const el = document.getElementById('incidentText');
  if (!el) return;
  incidentIdx = (incidentIdx + 1) % INCIDENT_LINES.length;
  el.textContent = INCIDENT_LINES[incidentIdx];
}

// ── GALERIE ──
const PHOTOS = [
  'media/fotky/foto-1.jpg',
  'media/fotky/foto-2.jpg',
  'media/fotky/foto-3.jpg',
  'media/fotky/foto-4.jpg',
  'media/fotky/foto-5.jpg',
];
let lightboxIndex = 0;

/**
 * Vytvoří mřížku fotek a propojí kliknutí s lightboxem.
 */
function renderGallery() {
  const grid = document.getElementById('gallery');
  if (!grid) return;
  grid.innerHTML = PHOTOS.map((src, i) =>
    `<img src="${src}" alt="Fotografie ${i + 1} ze svatby" loading="lazy" data-i="${i}">`
  ).join('');

  grid.addEventListener('click', (e) => {
    const img = e.target.closest('img');
    if (!img) return;
    openLightbox(Number(img.dataset.i));
  });
}

function openLightbox(i) {
  lightboxIndex = i;
  showLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLightbox() {
  const lb = document.getElementById('lightbox');
  lb.querySelector('img').src = PHOTOS[lightboxIndex];
  lb.querySelector('.lightbox-counter').textContent =
    (lightboxIndex + 1) + ' / ' + PHOTOS.length;
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function stepLightbox(dir) {
  lightboxIndex = (lightboxIndex + dir + PHOTOS.length) % PHOTOS.length;
  showLightbox();
}

document.addEventListener('DOMContentLoaded', () => {
  tick();
  setInterval(tick, 1000);
  setInterval(rotateIncident, 4000);
  renderGallery();

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => stepLightbox(1));
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    const open = document.getElementById('lightbox').classList.contains('open');
    if (!open) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  });
});
</script>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-label="Prohlížeč fotografií">
  <button class="lightbox-close" id="lightboxClose" aria-label="Zavřít">✕</button>
  <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Předchozí">‹</button>
  <img src="" alt="Fotografie ze svatby">
  <button class="lightbox-nav next" id="lightboxNext" aria-label="Další">›</button>
  <div class="lightbox-counter"></div>
</div>
</body>
</html>
