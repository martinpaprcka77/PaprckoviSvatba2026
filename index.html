<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5e6dc">
<title>Dagmar + Martin Paprčkovi — 29. srpna 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #b25a4e;
  --rose-deep: #93443b;
  --rose-light: #f7e3da;
  --rose-mid: #e6b9a6;
  --gold: #b8943f;
  --gold-light: #d9bc7a;
  --gold-dark: #8f6f26;
  --cream: #fbf1e7;
  --text: #43241d;
  --text-muted: #8a5f52;
  --bg: #f5e7da;
  --white: #fffdf9;
  --card: linear-gradient(160deg, #fffdf7 0%, #fdeeda 55%, #f8e0cd 100%);
  --shadow: 0 10px 30px rgba(122, 62, 45, 0.14);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html { font-size: 18px; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  font-family: 'Lato', sans-serif;
  font-size: 18px;
  line-height: 1.5;
  background:
    radial-gradient(120% 60% at 10% -5%, rgba(233, 180, 150, 0.35), transparent 60%),
    radial-gradient(120% 60% at 100% 20%, rgba(216, 190, 150, 0.28), transparent 55%),
    linear-gradient(180deg, #f6e3d3 0%, #f3ddcb 45%, #f0d7c2 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh; /* iPhone: bez posuvu kvůli dynamické adresní liště */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
img { max-width: 100%; height: auto; }
button { font-family: inherit; touch-action: manipulation; }

/* ── HERO ── */
.hero {
  background:
    radial-gradient(80% 50% at 50% 0%, rgba(255, 252, 245, 0.9), transparent 60%),
    radial-gradient(120% 120% at 50% 120%, rgba(224, 150, 120, 0.4), transparent 55%),
    linear-gradient(165deg, #fbe9d8 0%, #f5d3bd 55%, #edbd9f 100%);
  text-align: center;
  padding: calc(52px + var(--safe-top)) 24px 46px;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid rgba(178, 90, 78, 0.4);
  box-shadow: inset 0 -18px 30px -20px rgba(122, 62, 45, 0.5);
}
.hero-floral {
  position: absolute; font-size: 130px; opacity: 0.16; pointer-events: none;
  filter: sepia(35%) saturate(1.2);
}
.hero-floral.tl { top: -24px; left: -24px; transform: rotate(-25deg); }
.hero-floral.br { bottom: -26px; right: -24px; transform: rotate(18deg); }
.hero-floral.c { top: 30%; left: -40px; transform: rotate(-15deg); font-size: 90px; }
.hero-floral.c2 { top: 26%; right: -40px; transform: rotate(12deg); font-size: 90px; }
.hero-pre {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--rose-deep);
  margin-bottom: 12px;
}
.hero-names {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(38px, 11vw, 84px);
  color: var(--gold-dark);
  line-height: 1.15;
  text-shadow: 0 2px 0 rgba(255,255,255,0.6), 0 3px 10px rgba(160, 90, 55, 0.25);
  display: inline-block;
  max-width: 100%;
}
.hero-amp,
.hero-surname {
  color: var(--rose-deep);
  display: inline;
  font-size: inherit;
  font-family: inherit;
  white-space: nowrap;
}
/* Úzké displeje (iPhone SE a menší): jméno na jeden řádek, o něco menší písmo */
@media (max-width: 360px) {
  .hero-names { font-size: clamp(30px, 9vw, 40px); }
}
.hero-divider {
  width: 210px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 16px auto 8px;
  border: none;
}
.hero-ornament { font-size: 18px; color: var(--gold); letter-spacing: 6px; }
.hero-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  color: var(--text);
  letter-spacing: 0.5px;
  font-weight: 600;
}
.hero-thanks {
  max-width: 480px;
  margin: 16px auto 0;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 23px;
  color: var(--text);
  line-height: 1.6;
  background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.25));
  padding: 12px 22px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.6);
}

/* ── COUNT-UP (since the wedding) ── */
.since-wrap {
  margin-top: 24px;
  padding: 16px 12px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,244,230,0.6));
  border: 1px solid rgba(178, 90, 78, 0.4);
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(122, 62, 45, 0.18);
  backdrop-filter: blur(6px);
}
.since-label {
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--rose-deep);
  margin-bottom: 12px;
  font-weight: 500;
}
.since-grid {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.since-box {
  min-width: 66px;
  background: linear-gradient(170deg, #fffdf6, #f9e7d6);
  border: 1px solid rgba(178, 90, 78, 0.35);
  border-radius: 12px;
  padding: 10px 8px 8px;
  box-shadow: 0 4px 12px rgba(122, 62, 45, 0.12);
}
.since-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  color: var(--gold-dark);
  display: block;
  line-height: 1;
  font-weight: 700;
}
.since-unit {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--rose-deep);
  font-weight: 500;
}

/* ── CONTAINER / SECTION ── */
.container { max-width: 560px; margin: 0 auto; padding: 22px 14px 40px; }
.section {
  margin-top: 24px;
  background: var(--card);
  border-radius: 20px;
  border: 1px solid rgba(178, 90, 78, 0.35);
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
}
.section::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(90% 60% at 100% 0%, rgba(217, 188, 122, 0.28), transparent 60%);
  pointer-events: none;
}
.section > * { position: relative; }
.section-head {
  padding: 20px 20px 12px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1px dashed rgba(178, 90, 78, 0.35);
  flex-wrap: wrap;
}
.section-title {
  font-family: 'Great Vibes', cursive;
  font-size: 40px;
  color: var(--gold-dark);
  text-shadow: 0 1px 0 rgba(255,255,255,0.7);
}
.section-sub {
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 500;
}
.section-body { padding: 18px 20px 20px; }

/* ── PHOTO GALLERY ── */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.gallery-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 4px 14px rgba(122, 62, 45, 0.25);
  display: block;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.gallery-grid img:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(122, 62, 45, 0.32); }

/* ── LIGHTBOX ── */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(20, 10, 8, 0.94);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: calc(24px + var(--safe-top)) 12px calc(24px + var(--safe-bottom));
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.lightbox-close {
  position: absolute;
  top: calc(12px + var(--safe-top));
  right: 12px;
  font-size: 30px;
  line-height: 1;
  color: var(--rose-light);
  background: none;
  border: none;
  cursor: pointer;
  min-width: 44px;
  min-height: 44px;
}
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 38px;
  color: var(--rose-light);
  background: none;
  border: none;
  cursor: pointer;
  padding: 12px;
  line-height: 1;
  min-width: 48px;
  min-height: 64px;
}
.lightbox-nav.prev { left: 4px; }
.lightbox-nav.next { right: 4px; }
.lightbox-counter {
  position: absolute;
  bottom: calc(16px + var(--safe-bottom));
  left: 0; right: 0;
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--rose-mid);
}

/* ── JUST MARRIED HEART ── */
.heart-badge {
  margin: 26px auto 0;
  display: inline-block;
  filter: drop-shadow(0 6px 12px rgba(122, 62, 45, 0.35));
  animation: heartBeat 2.6s ease-in-out infinite;
  transform-origin: center;
}
.heart-badge svg {
  width: 170px;
  height: auto;
}
@keyframes heartBeat {
  0%, 40%, 80%, 100% { transform: scale(1); }
  45%, 55% { transform: scale(1.06); }
}
@media (prefers-reduced-motion: reduce) {
  .heart-badge { animation: none; }
}

/* ── FOOTER ── */
.footer {
  margin-top: 26px;
  text-align: center;
  padding: 26px 16px calc(24px + var(--safe-bottom));
  background: linear-gradient(180deg, rgba(178, 90, 78, 0.06), rgba(178, 90, 78, 0.16));
  border: 1px solid rgba(178, 90, 78, 0.25);
  border-radius: 20px;
  box-shadow: var(--shadow);
  font-size: 15px;
  color: var(--rose-deep);
  letter-spacing: 1px;
}
.footer-names {
  font-family: 'Great Vibes', cursive;
  font-size: 40px;
  color: var(--gold-dark);
  text-shadow: 0 1px 0 rgba(255,255,255,0.7);
  display: block;
  margin-bottom: 8px;
}
.footer-ornament { display: block; font-size: 15px; color: var(--gold); letter-spacing: 5px; margin-bottom: 8px; }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-floral tl">🌸</div>
  <div class="hero-floral c">🌿</div>
  <div class="hero-floral c2">🌷</div>
  <div class="hero-floral br">🌸</div>
  <div class="hero-pre">Děkujeme, že jste s námi</div>
  <div class="hero-names">Dagmar <span class="hero-amp">+</span> Martin Paprčkovi</div>
  <div class="hero-divider"></div>
  <div class="hero-ornament">✦ ❀ ✦</div>
  <div class="hero-date">Vzali jsme se 29. srpna 2026</div>
  <div class="hero-thanks">Bylo nám ctí oslavit s Vámi náš nejkrásnější den.</div>

  <div class="since-wrap">
    <div class="since-label">Náš společný čas</div>
    <div class="since-grid">
      <div class="since-box"><span class="since-num" id="sc-d">--</span><span class="since-unit">dní</span></div>
      <div class="since-box"><span class="since-num" id="sc-h">--</span><span class="since-unit">hodin</span></div>
      <div class="since-box"><span class="since-num" id="sc-m">--</span><span class="since-unit">minut</span></div>
      <div class="since-box"><span class="since-num" id="sc-s">--</span><span class="since-unit">sekund</span></div>
    </div>
  </div>

  <div class="heart-badge" aria-hidden="true">
    <svg viewBox="0 0 200 185" width="150" height="139">
      <defs>
        <linearGradient id="heartGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4ddb0"/>
          <stop offset="0.5" stop-color="#caa84f"/>
          <stop offset="1" stop-color="#a8872e"/>
        </linearGradient>
      </defs>
      <path d="M100 176 C 22 118 6 74 20 44 C 34 14 84 12 100 44 C 116 12 166 14 180 44 C 194 74 178 118 100 176 Z"
            fill="url(#heartGold)"
            stroke="#7a5a18"
            stroke-width="2.5"/>
      <!-- emboss: tmavý stín (vrstva dole) -->
      <text x="100" y="84" text-anchor="middle" font-family="'Great Vibes',cursive"
            font-size="30" fill="#7a5a18" opacity="0.85">Just</text>
      <text x="100" y="111" text-anchor="middle" font-family="'Great Vibes',cursive"
            font-size="31" fill="#7a5a18" opacity="0.85">married</text>
      <!-- emboss: světlý reliéf nahoře (posunutý nahoru o ~1px) -->
      <text x="100" y="82.5" text-anchor="middle" font-family="'Great Vibes',cursive"
            font-size="30" fill="#fff7e0" opacity="0.98">Just</text>
      <text x="100" y="109.5" text-anchor="middle" font-family="'Great Vibes',cursive"
            font-size="31" fill="#fff7e0" opacity="0.98">married</text>
    </svg>
  </div>
</div>

<div class="container">

  <!-- FOTKY -->
  <div class="section">
    <div class="section-head">
      <span class="section-title">Fotky z našeho dne</span>
      <span class="section-sub">pár vzpomínek</span>
    </div>
    <div class="section-body">
      <div class="gallery-grid" id="gallery"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-names">Dagmar + Martin Paprčkovi</span>
    <span class="footer-ornament">❀ ─── ✦ ─── ❀</span>
    29 · 08 · 2026 · Ostrava
  </div>

</div>

<script>
const WEDDING = new Date('2026-08-29T11:15:00'); // čas obřadu

/**
 * Počítadlo nahoru — kolik času uplynulo od svatby (na rozdíl od odpočtu dolů).
 * Čas běží od okamžiku obřadu dál; nikdy se nezastaví.
 */
function tick() {
  const now = Date.now();
  let diff = now - WEDDING.getTime();
  if (diff < 0) diff = 0; // před svatbou ukazuje nuly

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('sc-d').textContent = d;
  document.getElementById('sc-h').textContent = String(h).padStart(2, '0');
  document.getElementById('sc-m').textContent = String(m).padStart(2, '0');
  document.getElementById('sc-s').textContent = String(s).padStart(2, '0');
}

// ── GALERIE ──
const PHOTOS = [
  'media/fotky/foto-1.jpg',
  'media/fotky/foto-2.jpg',
  'media/fotky/foto-3.jpg',
  'media/fotky/foto-4.jpg',
  'media/fotky/foto-5.jpg',
];
let lightboxIndex = 0;

/**
 * Vytvoří mřížku fotek a propojí kliknutí s lightboxem.
 */
function renderGallery() {
  const grid = document.getElementById('gallery');
  if (!grid) return;
  grid.innerHTML = PHOTOS.map((src, i) =>
    `<img src="${src}" alt="Fotografie ${i + 1} ze svatby" loading="lazy" data-i="${i}">`
  ).join('');

  grid.addEventListener('click', (e) => {
    const img = e.target.closest('img');
    if (!img) return;
    openLightbox(Number(img.dataset.i));
  });
}

function openLightbox(i) {
  lightboxIndex = i;
  showLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLightbox() {
  const lb = document.getElementById('lightbox');
  lb.querySelector('img').src = PHOTOS[lightboxIndex];
  lb.querySelector('.lightbox-counter').textContent =
    (lightboxIndex + 1) + ' / ' + PHOTOS.length;
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function stepLightbox(dir) {
  lightboxIndex = (lightboxIndex + dir + PHOTOS.length) % PHOTOS.length;
  showLightbox();
}

document.addEventListener('DOMContentLoaded', () => {
  tick();
  setInterval(tick, 1000);
  renderGallery();

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => stepLightbox(1));
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    const open = document.getElementById('lightbox').classList.contains('open');
    if (!open) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  });
});
</script>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-label="Prohlížeč fotografií">
  <button class="lightbox-close" id="lightboxClose" aria-label="Zavřít">✕</button>
  <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Předchozí">‹</button>
  <img src="" alt="Fotografie ze svatby">
  <button class="lightbox-nav next" id="lightboxNext" aria-label="Další">›</button>
  <div class="lightbox-counter"></div>
</div>
</body>
</html>
