<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5e6dc">
<title>Dagmar &amp; Martin — 29. srpna 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #c9756a;
  --rose-light: #f5e6dc;
  --rose-mid: #e8c5b0;
  --gold: #c9a96e;
  --gold-dark: #a8893a;
  --text: #4a2e28;
  --text-muted: #9e7060;
  --bg: #fdf8f4;
  --white: #ffffff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  font-family: 'Lato', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh; /* iPhone: bez posuvu kvůli dynamické adresní liště */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
img { max-width: 100%; height: auto; }
button { font-family: inherit; touch-action: manipulation; }

/* ── HERO ── */
.hero {
  background: linear-gradient(160deg, #fdf0e8 0%, #f9e4d4 60%, #f2d5c0 100%);
  text-align: center;
  padding: calc(48px + var(--safe-top)) 24px 44px;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--rose-mid);
}
.hero-floral {
  position: absolute; font-size: 110px; opacity: 0.12; pointer-events: none;
  filter: sepia(60%);
}
.hero-floral.tl { top: -20px; left: -20px; transform: rotate(-25deg); }
.hero-floral.br { bottom: -20px; right: -20px; transform: rotate(15deg); }
.hero-pre {
  font-weight: 300;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.hero-names {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(46px, 13vw, 66px);
  color: var(--gold);
  line-height: 1.1;
  text-shadow: 0 2px 12px rgba(201,169,110,0.25);
}
.hero-amp {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(28px, 7vw, 38px);
  color: var(--rose);
  display: block;
  margin: 2px 0;
}
.hero-divider {
  width: 100px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 16px auto;
}
.hero-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: 1px;
}
.hero-thanks {
  max-width: 460px;
  margin: 18px auto 0;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--text);
  line-height: 1.6;
}

/* ── COUNT-UP (since the wedding) ── */
.since-wrap {
  margin-top: 26px;
  padding: 18px 12px;
  background: rgba(255,255,255,0.72);
  border: 1px solid var(--rose-mid);
  border-radius: 16px;
  backdrop-filter: blur(4px);
}
.since-label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.since-grid {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.since-box {
  min-width: 58px;
}
.since-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  color: var(--gold);
  display: block;
  line-height: 1;
  font-weight: 600;
}
.since-unit {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ── CONTAINER / SECTION ── */
.container { max-width: 540px; margin: 0 auto; padding: 0 14px 40px; }
.section {
  margin-top: 20px;
  background: var(--white);
  border-radius: 16px;
  border: 1px solid var(--rose-mid);
  overflow: hidden;
}
.section-head {
  padding: 16px 18px 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.section-title {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  color: var(--gold);
}
.section-sub {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.section-body { padding: 12px 18px 16px; }

/* ── PHOTO GALLERY ── */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.gallery-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--rose-light);
  display: block;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.gallery-grid img:hover { transform: scale(1.02); opacity: 0.92; }

/* ── LIGHTBOX ── */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(20, 10, 8, 0.94);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: calc(24px + var(--safe-top)) 12px calc(24px + var(--safe-bottom));
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.lightbox-close {
  position: absolute;
  top: calc(12px + var(--safe-top));
  right: 12px;
  font-size: 30px;
  line-height: 1;
  color: var(--rose-light);
  background: none;
  border: none;
  cursor: pointer;
  min-width: 44px;
  min-height: 44px;
}
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 38px;
  color: var(--rose-light);
  background: none;
  border: none;
  cursor: pointer;
  padding: 12px;
  line-height: 1;
  min-width: 48px;
  min-height: 64px;
}
.lightbox-nav.prev { left: 4px; }
.lightbox-nav.next { right: 4px; }
.lightbox-counter {
  position: absolute;
  bottom: calc(16px + var(--safe-bottom));
  left: 0; right: 0;
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--rose-mid);
}

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 26px 16px calc(20px + var(--safe-bottom));
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1px;
}
.footer-names {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  color: var(--gold);
  display: block;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-floral tl">🌸</div>
  <div class="hero-floral br">🌸</div>
  <div class="hero-pre">Děkujeme, že jste s námi</div>
  <div class="hero-names">
    Dagmar Sobková
    <span class="hero-amp">&amp;</span>
    Martin Paprčka
  </div>
  <div class="hero-divider"></div>
  <div class="hero-date">Vzali jsme se 29. srpna 2026</div>
  <div class="hero-thanks">Bylo nám ctí oslavit s Vámi náš nejkrásnější den.</div>

  <div class="since-wrap">
    <div class="since-label">Náš společný čas</div>
    <div class="since-grid">
      <div class="since-box"><span class="since-num" id="sc-d">--</span><span class="since-unit">dní</span></div>
      <div class="since-box"><span class="since-num" id="sc-h">--</span><span class="since-unit">hodin</span></div>
      <div class="since-box"><span class="since-num" id="sc-m">--</span><span class="since-unit">minut</span></div>
      <div class="since-box"><span class="since-num" id="sc-s">--</span><span class="since-unit">sekund</span></div>
    </div>
  </div>
</div>

<div class="container">

  <!-- FOTKY -->
  <div class="section">
    <div class="section-head">
      <span class="section-title">Fotky z našeho dne</span>
      <span class="section-sub">pár vzpomínek</span>
    </div>
    <div class="section-body">
      <div class="gallery-grid" id="gallery"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-names">Dagmar &amp; Martin</span>
    29 · 08 · 2026 · Ostrava
  </div>

</div>

<script>
const WEDDING = new Date('2026-08-29T11:15:00'); // čas obřadu

/**
 * Počítadlo nahoru — kolik času uplynulo od svatby (na rozdíl od odpočtu dolů).
 * Čas běží od okamžiku obřadu dál; nikdy se nezastaví.
 */
function tick() {
  const now = Date.now();
  let diff = now - WEDDING.getTime();
  if (diff < 0) diff = 0; // před svatbou ukazuje nuly

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('sc-d').textContent = d;
  document.getElementById('sc-h').textContent = String(h).padStart(2, '0');
  document.getElementById('sc-m').textContent = String(m).padStart(2, '0');
  document.getElementById('sc-s').textContent = String(s).padStart(2, '0');
}

// ── GALERIE ──
const PHOTOS = [
  'media/fotky/foto-1.jpg',
  'media/fotky/foto-2.jpg',
  'media/fotky/foto-3.jpg',
  'media/fotky/foto-4.jpg',
  'media/fotky/foto-5.jpg',
];
let lightboxIndex = 0;

/**
 * Vytvoří mřížku fotek a propojí kliknutí s lightboxem.
 */
function renderGallery() {
  const grid = document.getElementById('gallery');
  if (!grid) return;
  grid.innerHTML = PHOTOS.map((src, i) =>
    `<img src="${src}" alt="Fotografie ${i + 1} ze svatby" loading="lazy" data-i="${i}">`
  ).join('');

  grid.addEventListener('click', (e) => {
    const img = e.target.closest('img');
    if (!img) return;
    openLightbox(Number(img.dataset.i));
  });
}

function openLightbox(i) {
  lightboxIndex = i;
  showLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLightbox() {
  const lb = document.getElementById('lightbox');
  lb.querySelector('img').src = PHOTOS[lightboxIndex];
  lb.querySelector('.lightbox-counter').textContent =
    (lightboxIndex + 1) + ' / ' + PHOTOS.length;
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function stepLightbox(dir) {
  lightboxIndex = (lightboxIndex + dir + PHOTOS.length) % PHOTOS.length;
  showLightbox();
}

document.addEventListener('DOMContentLoaded', () => {
  tick();
  setInterval(tick, 1000);
  renderGallery();

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => stepLightbox(1));
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    const open = document.getElementById('lightbox').classList.contains('open');
    if (!open) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  });
});
</script>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-label="Prohlížeč fotografií">
  <button class="lightbox-close" id="lightboxClose" aria-label="Zavřít">✕</button>
  <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Předchozí">‹</button>
  <img src="" alt="Fotografie ze svatby">
  <button class="lightbox-nav next" id="lightboxNext" aria-label="Další">›</button>
  <div class="lightbox-counter"></div>
</div>
</body>
</html>
