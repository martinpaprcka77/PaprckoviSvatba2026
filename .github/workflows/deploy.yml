name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy files
        run: |
          mkdir deploy_out
          cp index.html deploy_out/
          cp planner.html deploy_out/
          cp index_june.html deploy_out/
          cp karaoke.html deploy_out/
          cp -r data deploy_out/
          cp -r public/* deploy_out/ 2>/dev/null || true
          cp -r media deploy_out/ 2>/dev/null || true
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy_out
      - uses: actions/deploy-pages@v4
        id: deployment
