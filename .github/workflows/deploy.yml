name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Pages artifact
        run: |
          set -e
          rm -rf deploy_out
          mkdir -p deploy_out

          # Public HTML entry points.
          cp index.html deploy_out/
          cp landing.html deploy_out/
          cp planner.html deploy_out/
          cp index_june.html deploy_out/
          cp karaoke.html deploy_out/

          # Runtime data and public assets.
          cp -R data deploy_out/data
          cp -R media deploy_out/media
          cp -R public/. deploy_out/

          # Keep repository documentation and development-only files out of Pages.
          rm -f deploy_out/README.md
          rm -rf deploy_out/docs deploy_out/.github deploy_out/.claude deploy_out/.continue

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy_out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
